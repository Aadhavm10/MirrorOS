<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MirrorOS Settings</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MirrorOS">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>MirrorOS</h1>
    <p class="subtitle">Settings</p>

    <section class="card">
      <h2>Weather location</h2>
      <p class="current">Currently: <span id="current-city">…</span></p>
      <input
        id="city-search"
        type="search"
        placeholder="Search for a city…"
        autocomplete="off"
        autocapitalize="words"
      >
      <div id="city-results"></div>
    </section>

    <section class="card">
      <h2>Commute</h2>
      <label for="commute-origin">From</label>
      <input id="commute-origin" type="text" placeholder="Home address" autocomplete="street-address">
      <label for="commute-destination">To</label>
      <input id="commute-destination" type="text" placeholder="Work address">
      <div class="field-row">
        <div>
          <label for="commute-depart">Leave at</label>
          <input id="commute-depart" type="time">
        </div>
        <div>
          <label for="commute-label">Label</label>
          <input id="commute-label" type="text" placeholder="Work">
        </div>
      </div>
      <button id="commute-save">Save commute</button>
    </section>

    <section class="card">
      <h2>Add calendar event</h2>
      <label for="event-title">Title</label>
      <input id="event-title" type="text" placeholder="Dentist appointment" autocapitalize="sentences">
      <div class="field-row">
        <div>
          <label for="event-date">Date</label>
          <input id="event-date" type="date">
        </div>
        <div id="event-time-field">
          <label for="event-time">Time</label>
          <input id="event-time" type="time">
        </div>
      </div>
      <div class="field-row">
        <div id="event-duration-field">
          <label for="event-duration">Duration (min)</label>
          <input id="event-duration" type="number" value="60" min="1" max="1440" step="5">
        </div>
        <div>
          <label for="event-allday">All day</label>
          <label class="toggle">
            <input id="event-allday" type="checkbox">
            <span></span>
          </label>
        </div>
      </div>
      <button id="event-save">Add to calendar</button>
    </section>

    <p id="toast" hidden></p>

    <p class="tip">
      Tip: in Safari, tap Share → “Add to Home Screen” to open this page like an app.
    </p>
  </main>
  <script src="settings.js" defer></script>
</body>
</html>
