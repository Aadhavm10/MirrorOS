<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>MirrorOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mirror">
    <div id="top-third">

      <section id="clock-section">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </section>

      <!-- Phase 2: weather -->
      <section id="weather-section">
        <div id="weather-primary">
          <span id="weather-temp"></span>
          <span id="weather-condition"></span>
        </div>
        <div id="weather-secondary">
          <span id="weather-high-low"></span>
          <span id="weather-rain"></span>
        </div>
      </section>

      <!-- Phase 3: calendar -->
      <section id="calendar-section"></section>

    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
